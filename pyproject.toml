[build-system]
requires = ["setuptools>=72.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "nanoamharic-morphbpe"
version = "0.1.0"
description = "MorphBPE + NanoAmharic: Morphology-Constrained Tokenization and CPU-Trainable Decoder-Only LM for Low-Resource Amharic"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["amharic", "ethiopic", "nlp", "low-resource", "tokenization", "language-model", "cpu-training"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "torch>=2.1.0",
    "numpy>=1.26.0",
    "transformers>=4.40.0",
    "datasets>=2.20.0",
    "tokenizers>=0.19.0",
    "sentencepiece>=0.2.0",
    "requests>=2.32.0",
    "tqdm>=4.66.0",
    "regex>=2024.0.0",
    "psutil>=5.9.0",
    "pyyaml>=6.0",
    "jsonlines>=4.0.0",
]

[project.optional-dependencies]
writing = [
    "language-tool-python>=2.8",
    "datasketch>=1.6.5",
    "textstat>=0.7.3",
    "spacy>=3.7.0",
    "sentence-transformers>=3.3.0",
    "onnxruntime>=1.19.0",
    "optimum>=1.23.0",
]
app = [
    "streamlit>=1.40.0",
    "Pillow>=10.4.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "black>=24.0",
    "isort>=5.13.0",
]

[project.urls]
Homepage = "https://github.com/research/nanoamharic-morphbpe"
Repository = "https://github.com/research/nanoamharic-morphbpe"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313"]

[tool.isort]
profile = "black"
line_length = 100

