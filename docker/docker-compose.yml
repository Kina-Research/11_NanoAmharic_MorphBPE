version: "3.8"

services:
  nanoamharic:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: nanoamharic-server
    ports:
      - "5000:5000"
    environment:
      - OMP_NUM_THREADS=4
      - FLASK_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

